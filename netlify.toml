# Конфигурация деплоя на Netlify: статика из dist/ + API одной функцией.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Запросы фронтенда к /api/... уходят в serverless-функцию.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Всё остальное отдаёт index.html — иначе /menu и /admin ломаются при перезагрузке.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
